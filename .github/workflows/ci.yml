name: CI/CD

on:
  push:
    branches: [dev, uat, main]
  pull_request:
    branches: [dev, uat, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/myapp
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.vars.outputs.environment }}
      branch: ${{ steps.vars.outputs.branch }}
    steps:
      - id: vars
        run: |
          BRANCH="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          case "$BRANCH" in
            main) ENVIRONMENT=prod ;;
            uat)  ENVIRONMENT=uat ;;
            *)    ENVIRONMENT=dev ;;
          esac
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir flake8
      - run: flake8 app --max-line-length=110 --exclude=app/tests

  lint-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "v3.15.4"
      - run: helm lint ./helm
      - run: helm template myapp ./helm > /dev/null

  lint-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"
      - working-directory: terraform
        run: terraform fmt -check -diff
      - working-directory: terraform
        run: terraform init -backend=false
      - working-directory: terraform
        run: terraform validate

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -r app/requirements-dev.txt
      - working-directory: app
        run: python -m pytest -v --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: app/report.xml

  build-image:
    runs-on: ubuntu-latest
    needs: [setup, lint-python, lint-helm, lint-terraform, test]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-plan:
    runs-on: ubuntu-latest
    needs: [setup, test]
    environment:
      name: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"
      - working-directory: terraform
        run: terraform init
      - working-directory: terraform
        run: |
          terraform plan \
            -var="image_tag=${IMAGE_TAG}" \
            -var="environment=${{ needs.setup.outputs.environment }}" \
            -var="namespace=${{ vars.NAMESPACE }}" \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="image_repository=${{ vars.IMAGE_REPOSITORY }}" \
            -out=plan.tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.setup.outputs.environment }}
          path: terraform/plan.tfplan
          retention-days: 1
